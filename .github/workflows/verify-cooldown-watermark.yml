name: Verify cooldown watermark
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261023173000_fix_repeated_abuse_cooldown.sql'
      - 'tests/*cooldown-watermark*.test.cjs'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/cooldown-watermark-summary.test.cjs
      - run: node tests/cooldown-watermark-migration-present.test.cjs
      - run: node tests/cooldown-watermark-allow.test.cjs
