name: Fix leave chat navigation

on:
  push:
    paths:
      - '.github/workflows/fix-leave-chat-navigation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch leave navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/app/session/[id]/RandomSessionClient.tsx')
          text = path.read_text()
          old = '''      await leaveRandomSession(session.id);\n      if (typingChannelReadyRef.current && typingChannelRef.current) {\n        await typingChannelRef.current.send({\n          type: "broadcast",\n          event: "refresh",\n          payload: { reason: "session-ended" },\n        }).catch(() => undefined);\n      }\n      goHome("USER_LEFT_SESSION", { serverSessionId: session.id });'''
          new = '''      const { error } = await leaveRandomSession(session.id);\n      if (error) throw error;\n\n      if (typingChannelReadyRef.current && typingChannelRef.current) {\n        void typingChannelRef.current.send({\n          type: "broadcast",\n          event: "refresh",\n          payload: { reason: "session-ended" },\n        }).catch(() => undefined);\n      }\n\n      goHome("USER_LEFT_SESSION", { serverSessionId: session.id });\n      window.setTimeout(() => {\n        if (window.location.pathname.startsWith("/session/")) {\n          window.location.replace(withNavigationDebugParam("/"));\n        }\n      }, 300);'''
          if old not in text:
              raise SystemExit('Expected leave flow not found; refusing unsafe patch')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'apps/web/app/session/[id]/RandomSessionClient.tsx'
          git diff --cached --check
          git commit -m 'fix(web): return home after leaving chat'
          git push
