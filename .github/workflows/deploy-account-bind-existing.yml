name: Deploy account-bind-existing Edge Function
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/account-bind-existing/**'
      - '.github/workflows/deploy-account-bind-existing.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-account-bind-existing-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment inputs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'SUPABASE_ACCESS_TOKEN is missing'; exit 1; }
          test -f supabase/functions/account-bind-existing/index.ts
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy account binding endpoint
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy account-bind-existing --project-ref vrwuxjujevhgsjmdjxmc --no-verify-jwt
