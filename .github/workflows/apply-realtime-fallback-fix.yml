name: Apply Realtime Fallback Fix

on:
  push:
    branches:
      - fix/egress-session-coalescing-v5
    paths:
      - .github/workflows/apply-realtime-fallback-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/egress-session-coalescing-v5
          fetch-depth: 0

      - name: Verify regression test is red before patch
        working-directory: apps/web
        run: |
          if node lib/realtime-fallback-polling-contract.test.mjs; then
            echo "Expected regression test to fail before implementation"
            exit 1
          fi

      - name: Apply minimal Realtime-aware fallback patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/app/session/[id]/RandomSessionClient.tsx')
          s = p.read_text()
          replacements = [
            (
              '  const typingChannelReadyRef = useRef(false);\n',
              '  const typingChannelReadyRef = useRef(false);\n  const realtimeHealthyRef = useRef(false);\n'
            ),
            (
              '      timer = window.setTimeout(() => {\n        syncNow();\n        scheduleNext();\n      }, delay);',
              '      timer = window.setTimeout(() => {\n        if (!realtimeHealthyRef.current) {\n          syncNow();\n        }\n        scheduleNext();\n      }, delay);'
            ),
            (
              '          if (status === "SUBSCRIBED") {\n            startingRealtime = false;',
              '          if (status === "SUBSCRIBED") {\n            realtimeHealthyRef.current = true;\n            startingRealtime = false;'
            ),
            (
              '          if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {\n            typingChannelReadyRef.current = false;',
              '          if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {\n            realtimeHealthyRef.current = false;\n            typingChannelReadyRef.current = false;'
            ),
            (
              '          if (status === "CLOSED") {\n            typingChannelReadyRef.current = false;',
              '          if (status === "CLOSED") {\n            realtimeHealthyRef.current = false;\n            typingChannelReadyRef.current = false;'
            ),
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'Expected source fragment not found: {old[:80]!r}')
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Verify regression test is green
        working-directory: apps/web
        run: node lib/realtime-fallback-polling-contract.test.mjs

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/session/'[id]'/RandomSessionClient.tsx
          git commit -m "fix(web): poll messages only when realtime is unhealthy"
          git push origin HEAD:fix/egress-session-coalescing-v5
