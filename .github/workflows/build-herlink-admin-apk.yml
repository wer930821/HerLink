name: Build HerLink Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "admin-app/**"
      - ".github/workflows/build-herlink-admin-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        working-directory: admin-app
        run: npm install

      - name: Generate Android project
        working-directory: admin-app
        run: npx expo prebuild --platform android --non-interactive

      - name: Build APK
        working-directory: admin-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp admin-app/android/app/build/outputs/apk/release/app-release.apk HerLink-Admin.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HerLink-Admin-APK
          path: HerLink-Admin.apk
          if-no-files-found: error
          retention-days: 14
