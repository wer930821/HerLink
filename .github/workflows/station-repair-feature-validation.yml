name: Station Repair Feature Validation

on:
  push:
    branches: [feat/station-operator-auto-repair]

permissions:
  contents: read

jobs:
  verify-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Station Operator and Repair tests
        run: node --test __tests__/station-operator-*.test.mjs __tests__/station-repair-*.test.mjs
      - name: TypeScript
        run: npm run typecheck --if-present
      - name: Production build
        run: npm run build
