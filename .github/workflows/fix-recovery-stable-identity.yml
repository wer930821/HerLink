name: Verify recovery stable identity
on:
  push:
    branches: [fix/permanent-recovery-frontend-claim]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify permanent recovery UI
        run: node --test apps/web/__tests__/permanent-recovery-ui.test.mjs
      - name: Verify recovery claim identity contract
        run: node --test apps/web/__tests__/permanent-recovery-claim-identity.test.mjs
