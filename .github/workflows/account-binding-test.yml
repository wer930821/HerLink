name: Account Binding Test

on:
  push:
    branches:
      - test/account-binding-existing-uuid
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Typecheck web
        working-directory: apps/web
        run: npm run typecheck
      - name: Account binding contract
        run: node work/account-binding-existing-uuid-contract.test.mjs
