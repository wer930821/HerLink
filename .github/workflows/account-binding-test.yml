name: Account Binding Test

on:
  push:
    branches:
      - test/account-binding-existing-uuid
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Account binding contract
        run: node work/account-binding-existing-uuid-contract.test.mjs
      - name: Typecheck controlled merge route
        working-directory: apps/web
        run: npx tsc --ignoreConfig --noEmit --skipLibCheck --target ES2022 --module esnext --moduleResolution bundler --jsx preserve --allowJs false app/api/account-binding/merge-existing/route.ts
