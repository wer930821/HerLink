name: Fix anonymous contact invite overlay

on:
  push:
    paths:
      - '.github/workflows/fix-anonymous-contact-invite-overlay.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify regression test fails before fix
        run: "! node --test work/anonymous-contact-invite-overlay.test.mjs"
      - name: Apply focused UI fix
        run: node work/fix-anonymous-contact-invite-overlay.mjs
      - name: Verify regression test passes
        run: node --test work/anonymous-contact-invite-overlay.test.mjs
      - name: Build web app
        working-directory: apps/web
        run: npm ci && npm run build
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-anonymous-contact-invite-overlay.yml work/fix-anonymous-contact-invite-overlay.mjs
          git add apps/web/app/session/'[id]'/RandomSessionClient.tsx apps/web/app/globals.css work/anonymous-contact-invite-overlay.test.mjs
          git commit -m 'fix: keep anonymous contact invite above chat messages'
          git push
