name: Station Operator PR Validation

on:
  pull_request:
    branches: [ci/station-operator-validation]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Station Operator tests
        run: npm run test:station-operator
      - name: TypeScript
        run: npm run typecheck --if-present
      - name: Production build
        run: npm run build
