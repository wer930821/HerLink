name: Build HerLink Native Google Play AAB

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  build-native-play-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Configure Play Store native build
        shell: bash
        run: |
          VERSION_CODE="$((GITHUB_RUN_NUMBER + 200))"
          VERSION_NAME="1.0.${VERSION_CODE}"
          export VERSION_CODE VERSION_NAME
          node - <<'NODE'
          const fs = require("fs");
          const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
          app.expo.version = process.env.VERSION_NAME;
          app.expo.android = app.expo.android || {};
          app.expo.android.versionCode = Number(process.env.VERSION_CODE);
          app.expo.android.permissions = (app.expo.android.permissions || [])
            .filter((p) => p !== "android.permission.REQUEST_INSTALL_PACKAGES");
          app.expo.extra = { ...(app.expo.extra || {}), playStoreBuild: true };
          fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
          NODE
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

      - name: Typecheck native app
        run: npm run typecheck

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build native Google Play AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --max-workers=2

      - name: Collect AAB
        run: cp android/app/build/outputs/bundle/release/app-release.aab HerLink-Native-Play.aab

      - name: Upload native AAB
        uses: actions/upload-artifact@v4
        with:
          name: HerLink-Native-Google-Play-AAB
          path: HerLink-Native-Play.aab
          if-no-files-found: error
          retention-days: 14
