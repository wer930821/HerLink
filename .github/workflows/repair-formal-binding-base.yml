name: Repair formal binding base
on:
  push:
    branches: [feat/formal-guxing-binding-main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/formal-guxing-binding-main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Repair escaped newlines in Supabase client
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("apps/web/lib/supabase.ts")
          s=p.read_text()
          marker=chr(92)+"n"
          if marker not in s:
              raise SystemExit("No literal escaped newline found")
          p.write_text(s.replace(marker, chr(10)))
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/supabase.ts
          git diff --cached --check
          git commit -m "fix(web): repair escaped newlines in Supabase client"
          git push
