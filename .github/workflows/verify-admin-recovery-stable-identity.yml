name: Verify admin recovery stable identity

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261009003000_admin_recovery_stable_identity.sql'
      - 'supabase/migrations/20261020_admin_recovery_preserve_original_identity.sql'
      - 'apps/web/__tests__/admin-recovery-stable-identity.test.mjs'
      - '.github/workflows/verify-admin-recovery-stable-identity.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify stable identity binding migration
        shell: bash
        run: |
          set -euo pipefail
          f=supabase/migrations/20261020_admin_recovery_preserve_original_identity.sql
          test -f "$f"
          grep -q 'anonymous_identity_device_state' "$f"
          grep -q 'active_auth_user_id' "$f"
          grep -Eq 'anonymous_identity_id, active_auth_user_id, generation, updated_at' "$f"
          grep -Eq 'values \([[:space:]]*v_source,[[:space:]]*p_target_user_id,[[:space:]]*1' "$f"
          grep -q 'where active_auth_user_id = p_target_user_id' "$f"
          grep -q 'generation = generation + 1' "$f"
          ! grep -Eiq 'update public\.(random_chat_sessions|random_chat_messages|anonymous_contacts)|set anonymous_display_name' "$f"
          echo 'GREEN: admin recovery migration contains stable identity persistence and idempotent repair path.'
      - name: Run focused stable identity test
        run: node --test apps/web/__tests__/admin-recovery-stable-identity.test.mjs
