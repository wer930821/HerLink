name: Station Repair Guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    if: startsWith(github.head_ref, 'ai-repair/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject forbidden file changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/changed.txt
          cat /tmp/changed.txt
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              apps/web/lib/station-operator/*|apps/web/app/api/internal/station-operator/*|apps/web/app/api/internal/station-repair/*)
                echo "Forbidden AI repair safety path: $path" >&2
                exit 1
                ;;
              apps/web/app/*|apps/web/components/*|apps/web/lib/*|apps/web/__tests__/*)
                ;;
              *)
                echo "Forbidden AI repair file: $path" >&2
                exit 1
                ;;
            esac
            case "$path" in
              */.env|*/.env.*|.env|.env.*|*/secrets/*|*/credentials/*|*/vercel.json|*/package.json|*/package-lock.json|*/pnpm-lock.yaml|*/yarn.lock)
                echo "Forbidden AI repair config/secret file: $path" >&2
                exit 1
                ;;
            esac
          done < /tmp/changed.txt

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Station operator tests
        working-directory: apps/web
        run: npm run test:station-operator

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Build
        working-directory: apps/web
        run: npm run build
