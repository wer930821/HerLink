name: Repair session literal newlines

on:
  push:
    branches:
      - fix/session-literal-newlines-ci
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/session-literal-newlines-ci
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Replace accidental literal newline escapes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/app/session/[id]/page.tsx')
          text = path.read_text()
          before = text.count(r'\n')
          if before:
              text = text.replace(r'\n', '\n')
              path.write_text(text)
          print(f'replaced {before} literal newline escapes')
          PY
      - name: Persist repair
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- 'apps/web/app/session/[id]/page.tsx'; then
            echo "No newline repair to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add 'apps/web/app/session/[id]/page.tsx'
            git diff --cached --check
            git commit -m "fix(web): restore session source newlines"
            git push origin HEAD:fix/session-literal-newlines-ci
          fi
      - name: Install web dependencies
        run: npm ci --prefix apps/web
      - name: Typecheck
        run: npm run typecheck --prefix apps/web
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
        run: npm run build --prefix apps/web
