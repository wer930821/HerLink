name: Add incoming chat message alert

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-chat-message-alert.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Add incoming message alert
        run: echo "workflow trigger repaired"
