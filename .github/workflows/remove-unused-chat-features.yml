name: Fix My Chats unread badge position

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-unused-chat-features.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-home-chat-unread-position:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Prove badge positioning is missing
        shell: python
        run: |
          from pathlib import Path
          s=Path('apps/web/app/globals.css').read_text()
          if '.home-chat-unread {' in s:
            raise SystemExit('RED check unexpectedly passed before implementation')
      - name: Fix badge positioning
        shell: python
        run: |
          from pathlib import Path
          p=Path('apps/web/app/globals.css')
          s=p.read_text()
          css='''\n\n/* Keep the unread badge visually attached to My Chats. */\n.home-app-actions .home-chat-unread {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  flex: 0 0 auto;\n  min-width: 28px;\n  height: 28px;\n  margin-left: 10px;\n  padding: 0 7px;\n  border-radius: 999px;\n  background: #e52f2f;\n  color: #fff;\n  font-size: 16px;\n  font-weight: 800;\n  line-height: 1;\n  vertical-align: middle;\n}\n'''
          if '.home-app-actions .home-chat-unread {' not in s:
            p.write_text(s+css)
      - name: Verify badge stays with My Chats only
        shell: python
        run: |
          from pathlib import Path
          page=Path('apps/web/app/page.tsx').read_text()
          css=Path('apps/web/app/globals.css').read_text()
          assert 'href="/chats">我的聊天{chatUnreadCount > 0 ? <span className="home-chat-unread"' in page
          assert 'href="/contacts">匿名聯絡人</Button>' in page
          assert 'href="/contacts">匿名聯絡人{' not in page
          assert '.home-app-actions .home-chat-unread {' in css
          assert 'display: inline-flex;' in css
          print('My Chats unread badge position verified')
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install
      - name: Typecheck web
        working-directory: apps/web
        run: npm run typecheck
      - name: Build web
        working-directory: apps/web
        run: npm run build
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/globals.css
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'fix(web): keep unread badge on My Chats button'
          git push origin main
