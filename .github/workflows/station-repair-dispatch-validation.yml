name: Station Repair Dispatch Validation

on:
  push:
    branches: [fix/station-operator-repair-dispatch]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Repair dispatcher test
        run: node --test __tests__/station-repair-dispatch.test.mjs
      - name: Station Operator suite
        run: npm run test:station-operator
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
