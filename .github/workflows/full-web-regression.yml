name: Full HerLink Web Regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-web-regression.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck --if-present
      - name: Lint
        run: npm run lint --if-present
      - name: Existing regression checks
        shell: bash
        run: |
          set -e
          if [ -f scripts/check-home-chat-unread.mjs ]; then node scripts/check-home-chat-unread.mjs; fi
          for f in scripts/check-*.mjs; do
            [ -f "$f" ] || continue
            [ "$f" = "scripts/check-home-chat-unread.mjs" ] && continue
            echo "Running $f"
            node "$f"
          done
      - name: Production build
        run: npm run build
