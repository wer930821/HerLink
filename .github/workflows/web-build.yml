name: HerLink Web Build

on:
  push:
    branches: [main, test/reduce-chat-polling, fix/reduce-session-refresh, fix/egress-session-coalescing-v5]
    paths:
      - "apps/web/**"
      - "lib/**"
      - "tests/web-collection-access.test.cjs"
      - "tests/web-egg-permissions.test.cjs"
      - ".github/workflows/web-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install
      - run: node lib/public-account-flow.test.mjs
      - run: node lib/chat-polling-contract.test.mjs
      - run: node lib/realtime-diagnostics-contract.test.mjs
      - run: node lib/session-read-tracker-contract.test.mjs
      - run: node lib/session-refresh-contract.test.mjs
      - run: node lib/realtime-fallback-polling-contract.test.mjs
      - run: node lib/waiting-count-polling-contract.test.mjs
      - run: node lib/collection-replay.test.mjs
      - run: node ../../tests/web-collection-access.test.cjs
      - run: node ../../tests/web-egg-permissions.test.cjs
      - run: npm run typecheck
      - run: npm run build

# Full branch verification trigger after waiting-count optimization.
