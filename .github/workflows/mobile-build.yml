name: HerLink GitHub APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "context/**"
      - "lib/**"
      - "theme/**"
      - "assets/**"
      - "app.json"
      - "eas.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-build.yml"

permissions:
  contents: write

concurrency:
  group: herlink-android-latest
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Set build version
        shell: bash
        run: |
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          node - <<'NODE'
          const fs = require("fs");
          const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
          const code = Number(process.env.GITHUB_RUN_NUMBER);
          app.expo.version = `1.0.${code}`;
          app.expo.android = app.expo.android || {};
          app.expo.android.versionCode = code;
          fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
          NODE
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build APK on GitHub runner
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Copy APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ./HerLink.apk

      - name: Prepare update manifest
        shell: bash
        run: |
          APK_SHA256="$(sha256sum HerLink.apk | awk '{print $1}')"
          cat > update-info.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "https://github.com/wer930821/HerLink/releases/download/latest/HerLink.apk",
            "sha256": "${APK_SHA256}",
            "commit": "${GITHUB_SHA}"
          }
          EOF

      - name: Publish stable latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest             HerLink.apk             update-info.json             --title "HerLink Latest"             --notes "Automated Android build from ${GITHUB_SHA}"             --latest
