name: HerLink OTA Update

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "context/**"
      - "lib/**"
      - "theme/**"
      - "assets/**"
      - ".github/workflows/ota-update.yml"
  workflow_dispatch:

jobs:
  publish-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Publish Android OTA update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest update --channel preview --platform android --message "GitHub ${GITHUB_SHA::7}" --non-interactive
