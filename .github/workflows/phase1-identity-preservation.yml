name: Phase 1 Identity Preservation

on:
  pull_request:
    branches: [master]
    paths:
      - "apps/web/**"
      - "work/account-binding-phase1-test.mjs"
      - ".github/workflows/phase1-identity-preservation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix apps/web
      - name: Typecheck
        run: npm run typecheck --prefix apps/web
      - name: Build
        run: npm run build --prefix apps/web

  identity-preservation:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Supabase JS for isolated test runner
        run: npm install --no-save @supabase/supabase-js@2
      - name: Create isolated test environment
        env:
          TEST_URL: ${{ secrets.PHASE1_TEST_SUPABASE_URL }}
          TEST_ANON_KEY: ${{ secrets.PHASE1_TEST_SUPABASE_ANON_KEY }}
          TEST_SERVICE_ROLE_KEY: ${{ secrets.PHASE1_TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$TEST_URL"
          test -n "$TEST_ANON_KEY"
          test -n "$TEST_SERVICE_ROLE_KEY"
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_ANON_KEY=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\n' "$TEST_URL" "$TEST_ANON_KEY" "$TEST_SERVICE_ROLE_KEY" > .supabase.test.env
      - name: Run Phase 1 identity preservation test
        run: node work/account-binding-phase1-test.mjs
