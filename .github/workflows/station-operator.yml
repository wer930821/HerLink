name: HerLink Station Operator

on:
  workflow_dispatch:
    inputs:
      repair_id:
        description: '既有 queued repair ID（留空則執行一般輪詢）'
        required: false
        type: string

concurrency:
  group: herlink-station-operator
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run station operator
        env:
          OPERATOR_URL: ${{ secrets.STATION_OPERATOR_URL }}
          OPERATOR_SECRET: ${{ secrets.STATION_OPERATOR_SECRET }}
        run: |
          test -n "$OPERATOR_URL"
          test -n "$OPERATOR_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 --max-time 70 \
            -X POST "$OPERATOR_URL/api/internal/station-operator" \
            -H "Authorization: Bearer $OPERATOR_SECRET" \
            -H "Content-Type: application/json" \
            --data "{\"repairId\":\"${{ inputs.repair_id }}\"}"
