name: Verify formal account binding

on:
  push:
    branches: [feat/formal-guxing-binding-main]
    paths:
      - "apps/web/**"
      - "lib/**"
      - ".github/workflows/formal-binding-verify.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install
      - name: Formal binding contract
        run: node lib/formal-account-binding.test.mjs
      - run: npm run typecheck
      - run: npm run build
