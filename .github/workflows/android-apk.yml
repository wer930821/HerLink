name: Build HerLink Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "package.json"
      - "package-lock.json"
      - "app/**"
      - "lib/**"
      - "assets/**"
      - "app.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: herlink-android-master
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 取得 master 程式碼
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 同步 package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: 提交同步後的 lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json 已同步"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(android): sync package lock for notifications"
          git push origin HEAD:master

      - name: 使用 npm ci 安裝依賴
        run: npm ci --no-audit --no-fund

      - name: 設定 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 設定 Android SDK
        uses: android-actions/setup-android@v3

      - name: 產生 Android 原生專案
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: 建置 Release APK
        working-directory: android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2"
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 整理 APK
        shell: bash
        run: |
          mkdir -p dist
          APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/HerLink-admin-release.apk
          ls -lh dist/HerLink-admin-release.apk

      - name: 上傳 APK
        uses: actions/upload-artifact@v4
        with:
          name: HerLink-admin-android-apk
          path: dist/HerLink-admin-release.apk
          if-no-files-found: error
          retention-days: 30
