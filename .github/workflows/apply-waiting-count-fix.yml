name: Apply message count egress fix

on:
  push:
    branches:
      - fix/egress-session-coalescing-v5
    paths:
      - .github/workflows/apply-waiting-count-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/egress-session-coalescing-v5
      - name: Patch source
        run: |
          python -c "from pathlib import Path; p=Path('apps/web/app/session/[id]/RandomSessionClient.tsx'); s=p.read_text(); a='  const historicalThousandCheckedRef = useRef<Set<string>>(new Set());'; s=s.replace(a,a+'\\n  const sessionMessageCountRef = useRef(0);',1); p.write_text(s)"
          python -c "from pathlib import Path; p=Path('apps/web/app/session/[id]/RandomSessionClient.tsx'); s=p.read_text(); a='        if (!result.error && Number.isFinite(count)) setSessionMessageCount(count);'; b='        if (!result.error && Number.isFinite(count)) {\\n          sessionMessageCountRef.current = count;\\n          setSessionMessageCount(count);\\n        }'; assert a in s; p.write_text(s.replace(a,b,1))"
          python -c "from pathlib import Path; p=Path('apps/web/app/session/[id]/RandomSessionClient.tsx'); s=p.read_text(); a='        const countResult = await getRandomChatMessageCount(refreshedSession.id).catch(() => ({ data: null, error: null }));\\n        const messageCount = Number(countResult.data);\\n        if (!countResult.error && Number.isFinite(messageCount)) setSessionMessageCount(messageCount);'; b='        const messageCount = sessionMessageCountRef.current + 1;\\n        sessionMessageCountRef.current = messageCount;\\n        setSessionMessageCount(messageCount);'; assert a in s; p.write_text(s.replace(a,b,1))"
      - name: Commit
        run: |
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions-bot@users.noreply.github.com
          git add 'apps/web/app/session/[id]/RandomSessionClient.tsx'
          git commit -m 'fix(web): track message count locally after initial sync'
          git push origin HEAD:fix/egress-session-coalescing-v5
