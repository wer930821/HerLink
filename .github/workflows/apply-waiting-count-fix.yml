name: Apply realtime easter egg sync fix

on:
  push:
    branches: [fix/egress-session-coalescing-v5]
    paths:
      - ".github/workflows/apply-waiting-count-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/egress-session-coalescing-v5
      - name: Patch easter egg sync
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/app/session/[id]/RandomSessionClient.tsx')
          s = p.read_text()

          old = '  const easterEggPendingSyncRef = useRef(false);\n  const easterEggPlaybackBusyRef = useRef(false);'
          new = '  const easterEggPendingSyncRef = useRef(false);\n  const syncPendingEasterEggRef = useRef<(() => void) | null>(null);\n  const easterEggPlaybackBusyRef = useRef(false);'
          if old not in s:
              raise SystemExit('easter egg refs anchor not found')
          s = s.replace(old, new, 1)

          old = '''        .on("broadcast", { event: "message-recalled" }, () => {\n          void refreshMessagesFromServerRef.current?.({ forceScroll: false });\n        })\n        .on('''
          new = '''        .on("broadcast", { event: "message-recalled" }, () => {\n          void refreshMessagesFromServerRef.current?.({ forceScroll: false });\n        })\n        .on("broadcast", { event: "easter-egg" }, () => {\n          syncPendingEasterEggRef.current?.();\n        })\n        .on('''
          if old not in s:
              raise SystemExit('broadcast handler anchor not found')
          s = s.replace(old, new, 1)

          old = '''          if (eventId) {\n            const clientVersion = "web-v2";'''
          new = '''          if (eventId) {\n            const channel = typingChannelRef.current;\n            if (channel && typingChannelReadyRef.current) {\n              void channel.send({\n                type: "broadcast",\n                event: "easter-egg",\n                payload: { eventId },\n              }).catch(() => undefined);\n            }\n            const clientVersion = "web-v2";'''
          if old not in s:
              raise SystemExit('event dispatch anchor not found')
          s = s.replace(old, new, 1)

          old = '''    const onResume = () => void syncPendingEasterEgg();\n    void syncPendingEasterEgg();\n    timer = window.setInterval(() => void syncPendingEasterEgg(), EASTER_EGG_FALLBACK_POLL_MS);'''
          new = '''    syncPendingEasterEggRef.current = () => { void syncPendingEasterEgg(); };\n    const onResume = () => void syncPendingEasterEgg();\n    void syncPendingEasterEgg();\n    timer = window.setInterval(() => {\n      if (!realtimeHealthyRef.current) {\n        void syncPendingEasterEgg();\n      }\n    }, EASTER_EGG_FALLBACK_POLL_MS);'''
          if old not in s:
              raise SystemExit('easter egg polling anchor not found')
          s = s.replace(old, new, 1)

          old = '''      document.removeEventListener("visibilitychange", onResume);\n      easterEggPendingSyncRef.current = false;'''
          new = '''      document.removeEventListener("visibilitychange", onResume);\n      syncPendingEasterEggRef.current = null;\n      easterEggPendingSyncRef.current = false;'''
          if old not in s:
              raise SystemExit('easter egg cleanup anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Verify contract
        working-directory: apps/web
        run: node lib/easter-egg-polling-contract.test.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'apps/web/app/session/[id]/RandomSessionClient.tsx'
          git commit -m "fix(web): use realtime for easter egg sync" || exit 0
          git push origin HEAD:fix/egress-session-coalescing-v5
