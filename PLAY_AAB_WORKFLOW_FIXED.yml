name: Build HerLink Native Google Play AAB

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  build-native-play-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Configure Play Store native build
        shell: bash
        run: |
          VERSION_CODE="$((GITHUB_RUN_NUMBER + 200))"
          VERSION_NAME="1.0.${VERSION_CODE}"
          export VERSION_CODE VERSION_NAME
          node - <<'NODE'
          const fs = require("fs");
          const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
          app.expo.version = process.env.VERSION_NAME;
          app.expo.android = app.expo.android || {};
          app.expo.android.versionCode = Number(process.env.VERSION_CODE);
          app.expo.android.permissions = (app.expo.android.permissions || [])
            .filter((p) => p !== "android.permission.REQUEST_INSTALL_PACKAGES");
          app.expo.extra = { ...(app.expo.extra || {}), playStoreBuild: true };
          fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
          NODE
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

      # 型別檢查只當參考（repo 有既存的型別錯誤），不阻擋建置
      - name: Typecheck native app (informational)
        continue-on-error: true
        run: npm run typecheck

      - name: Configure Firebase for Android push
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json
          node - <<'NODE'
          const fs = require("fs");
          const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
          app.expo.android = app.expo.android || {};
          app.expo.android.googleServicesFile = "./google-services.json";
          fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
          const firebase = JSON.parse(fs.readFileSync("google-services.json", "utf8"));
          const pkg = firebase.client?.[0]?.client_info?.android_client_info?.package_name;
          if (pkg !== "com.wer93.herlink") throw new Error("Firebase package mismatch: " + pkg);
          NODE

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      # 正式簽名：用上傳金鑰（upload key）簽，不要用範本的 debug 金鑰
      - name: Restore upload keystore
        shell: bash
        env:
          HERLINK_UPLOAD_KEYSTORE_BASE64: ${{ secrets.HERLINK_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$HERLINK_UPLOAD_KEYSTORE_BASE64" || { echo "Missing secret HERLINK_UPLOAD_KEYSTORE_BASE64"; exit 1; }
          printf '%s' "$HERLINK_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/herlink-upload.jks"
          test -s "$GITHUB_WORKSPACE/herlink-upload.jks"

      - name: Patch release signing config
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = "android/app/build.gradle";
          let gradle = fs.readFileSync(path, "utf8");
          const releaseConfig = [
            "        release {",
            "            storeFile file(findProperty('HERLINK_UPLOAD_STORE_FILE'))",
            "            storePassword findProperty('HERLINK_UPLOAD_STORE_PASSWORD')",
            "            keyAlias findProperty('HERLINK_UPLOAD_KEY_ALIAS')",
            "            keyPassword findProperty('HERLINK_UPLOAD_KEY_PASSWORD')",
            "        }",
          ].join("\n");
          const debugBlock = /(\n\s*debug \{\n\s*storeFile file\('debug\.keystore'\)\n\s*storePassword 'android'\n\s*keyAlias 'androiddebugkey'\n\s*keyPassword 'android'\n\s*\})/;
          if (!debugBlock.test(gradle)) throw new Error("signingConfigs.debug block not found; template changed, patch needs updating");
          gradle = gradle.replace(debugBlock, "$1\n" + releaseConfig);
          const releaseSigning = /(release \{\n\s*)signingConfig signingConfigs\.debug/;
          if (!releaseSigning.test(gradle)) throw new Error("release signingConfig line not found; template changed, patch needs updating");
          gradle = gradle.replace(releaseSigning, "$1signingConfig signingConfigs.release");
          fs.writeFileSync(path, gradle);
          console.log("Release signing patched to use the upload key.");
          NODE

      - name: Build native Google Play AAB
        working-directory: android
        env:
          HERLINK_UPLOAD_STORE_PASSWORD: ${{ secrets.HERLINK_UPLOAD_STORE_PASSWORD }}
          HERLINK_UPLOAD_KEY_ALIAS: ${{ secrets.HERLINK_UPLOAD_KEY_ALIAS }}
          HERLINK_UPLOAD_KEY_PASSWORD: ${{ secrets.HERLINK_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --max-workers=2 \
            -PHERLINK_UPLOAD_STORE_FILE="$GITHUB_WORKSPACE/herlink-upload.jks" \
            -PHERLINK_UPLOAD_STORE_PASSWORD="$HERLINK_UPLOAD_STORE_PASSWORD" \
            -PHERLINK_UPLOAD_KEY_ALIAS="$HERLINK_UPLOAD_KEY_ALIAS" \
            -PHERLINK_UPLOAD_KEY_PASSWORD="$HERLINK_UPLOAD_KEY_PASSWORD"

      - name: Collect AAB
        run: cp android/app/build/outputs/bundle/release/app-release.aab HerLink-Native-Play.aab

      # 確認不是 debug 簽名（Play 會拒收 debug 金鑰簽的包）
      - name: Verify AAB signature is not the debug key
        shell: bash
        run: |
          CERT=$(keytool -printcert -jarfile HerLink-Native-Play.aab 2>/dev/null | head -5)
          echo "$CERT"
          if echo "$CERT" | grep -qi "Android Debug"; then
            echo "ERROR: AAB is signed with the debug key; Play will reject it."
            exit 1
          fi

      - name: Upload native AAB
        uses: actions/upload-artifact@v4
        with:
          name: HerLink-Native-Google-Play-AAB
          path: HerLink-Native-Play.aab
          if-no-files-found: error
          retention-days: 14
